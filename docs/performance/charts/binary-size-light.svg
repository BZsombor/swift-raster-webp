<svg xmlns="http://www.w3.org/2000/svg" width="760" height="248" viewBox="0 0 760 248" role="img" aria-label="Binary size added by the decoder">
<title>Binary size added by the decoder</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<text x="0" y="22" font-size="17" font-weight="600" fill="#1f2328">Binary size added by the decoder</text>
<text x="0" y="44" font-size="13" fill="#59636e">Static, stripped programs, shorter is better · Apple M5, Docker</text>
<text x="0" y="83" font-size="14" font-weight="400" fill="#1f2328">image-webp <tspan fill="#59636e" font-weight="400">Rust</tspan></text>
<rect x="230" y="70" width="167.3" height="18" rx="3" fill="#afb8c1"/>
<text x="405.3" y="83" font-size="13" font-weight="400" fill="#1f2328">128 KB</text>
<text x="0" y="113" font-size="14" font-weight="400" fill="#1f2328">x/image/webp <tspan fill="#59636e" font-weight="400">Go</tspan></text>
<rect x="230" y="100" width="174.9" height="18" rx="3" fill="#afb8c1"/>
<text x="412.9" y="113" font-size="13" font-weight="400" fill="#1f2328">134 KB</text>
<text x="0" y="143" font-size="14" font-weight="600" fill="#1f2328">swift-raster-webp <tspan fill="#59636e" font-weight="400">Swift</tspan></text>
<rect x="230" y="130" width="261.4" height="18" rx="3" fill="#0969da"/>
<text x="499.4" y="143" font-size="13" font-weight="600" fill="#1f2328">200 KB</text>
<text x="0" y="173" font-size="14" font-weight="400" fill="#1f2328">zenwebp <tspan fill="#59636e" font-weight="400">Rust</tspan></text>
<rect x="230" y="160" width="334.6" height="18" rx="3" fill="#afb8c1"/>
<text x="572.6" y="173" font-size="13" font-weight="400" fill="#1f2328">256 KB</text>
<text x="0" y="203" font-size="14" font-weight="400" fill="#1f2328">libwebp <tspan fill="#59636e" font-weight="400">C</tspan></text>
<rect x="230" y="190" width="420.0" height="18" rx="3" fill="#afb8c1"/>
<text x="658.0" y="203" font-size="13" font-weight="400" fill="#1f2328">321 KB</text>
<text x="0" y="238" font-size="12" fill="#59636e">Only natively compiled libraries. Go includes its image packages.</text>
</svg>
