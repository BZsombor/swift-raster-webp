<svg xmlns="http://www.w3.org/2000/svg" width="760" height="168" viewBox="0 0 760 168" role="img" aria-label="Lossless: decoding speed">
<title>Lossless: decoding speed</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<text x="0" y="22" font-size="17" font-weight="600" fill="#1f2328">Lossless: decoding speed</text>
<text x="0" y="44" font-size="13" fill="#59636e">Megapixels per second on a 11158 × 2156 photo, longer is better · Apple M5</text>
<text x="0" y="83" font-size="14" font-weight="400" fill="#1f2328">libwebp <tspan fill="#59636e" font-weight="400">C</tspan></text>
<rect x="230" y="70" width="420.0" height="18" rx="3" fill="#afb8c1"/>
<text x="658.0" y="83" font-size="13" font-weight="400" fill="#1f2328">76 Mpx/s</text>
