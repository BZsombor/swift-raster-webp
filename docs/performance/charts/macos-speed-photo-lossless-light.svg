<text x="611.0" y="113" font-size="13" font-weight="600" fill="#1f2328">67 Mpx/s</text>
<text x="0" y="143" font-size="14" font-weight="400" fill="#1f2328">ImageIO <tspan fill="#59636e" font-weight="400">Apple</tspan></text>
<rect x="230" y="130" width="200.6" height="18" rx="3" fill="#afb8c1"/>
