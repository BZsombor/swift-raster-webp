<svg xmlns="http://www.w3.org/2000/svg" width="760" height="188" viewBox="0 0 760 188" role="img" aria-label="Files decoded exactly like libwebp">
<title>Files decoded exactly like libwebp</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<text x="0" y="22" font-size="17" font-weight="600" fill="#1f2328">Files decoded exactly like libwebp</text>
<text x="0" y="44" font-size="13" fill="#59636e">Files of the libwebp test corpus with identical RGBA pixels, longer is better</text>
<text x="0" y="83" font-size="14" font-weight="600" fill="#1f2328">swift-raster-webp <tspan fill="#59636e" font-weight="400">Swift</tspan></text>
<rect x="230" y="70" width="420.0" height="18" rx="3" fill="#0969da"/>
<text x="658.0" y="83" font-size="13" font-weight="600" fill="#1f2328">131 of 131</text>
<text x="0" y="113" font-size="14" font-weight="400" fill="#1f2328">libwebp <tspan fill="#59636e" font-weight="400">C</tspan></text>
<rect x="230" y="100" width="420.0" height="18" rx="3" fill="#afb8c1"/>
<text x="658.0" y="113" font-size="13" font-weight="400" fill="#1f2328">131 of 131</text>
<text x="0" y="143" font-size="14" font-weight="400" fill="#1f2328">ImageIO <tspan fill="#59636e" font-weight="400">Apple</tspan></text>
<rect x="230" y="130" width="343.1" height="18" rx="3" fill="#afb8c1"/>
<text x="581.1" y="143" font-size="13" font-weight="400" fill="#1f2328">107 of 131</text>
<text x="0" y="178" font-size="12" fill="#59636e">Differences come from a different lossy color conversion, or from premultiplied alpha.</text>
</svg>
