<rect x="230" y="160" width="301.3" height="18" rx="3" fill="#656c76"/>
<text x="539.3" y="173" font-size="13" font-weight="400" fill="#f0f6fc">53 Mpx/s</text>
<text x="0" y="203" font-size="14" font-weight="400" fill="#f0f6fc">jwebp <tspan fill="#9198a1" font-weight="400">Java</tspan></text>
<rect x="230" y="190" width="286.5" height="18" rx="3" fill="#656c76"/>
<text x="524.5" y="203" font-size="13" font-weight="400" fill="#f0f6fc">51 Mpx/s</text>
