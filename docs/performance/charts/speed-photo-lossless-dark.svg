<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-label="Lossless: decoding speed">
<title>Lossless: decoding speed</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<text x="0" y="22" font-size="17" font-weight="600" fill="#f0f6fc">Lossless: decoding speed</text>
<text x="0" y="44" font-size="13" fill="#9198a1">Megapixels per second on a 11158 × 2156 photo, longer is better · Apple M5, Docker</text>
<text x="0" y="83" font-size="14" font-weight="400" fill="#f0f6fc">libwebp <tspan fill="#9198a1" font-weight="400">C</tspan></text>
<rect x="230" y="70" width="420.0" height="18" rx="3" fill="#656c76"/>
<text x="658.0" y="83" font-size="13" font-weight="400" fill="#f0f6fc">74 Mpx/s</text>
<text x="0" y="113" font-size="14" font-weight="400" fill="#f0f6fc">zenwebp <tspan fill="#9198a1" font-weight="400">Rust</tspan></text>
<rect x="230" y="100" width="349.3" height="18" rx="3" fill="#656c76"/>
<text x="587.3" y="113" font-size="13" font-weight="400" fill="#f0f6fc">62 Mpx/s</text>
<text x="0" y="143" font-size="14" font-weight="600" fill="#f0f6fc">swift-raster-webp <tspan fill="#9198a1" font-weight="400">Swift</tspan></text>
