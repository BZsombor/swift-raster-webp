<rect x="230" y="250" width="206.3" height="18" rx="3" fill="#656c76"/>
<text x="444.3" y="263" font-size="13" font-weight="400" fill="#f0f6fc">36 Mpx/s</text>
<text x="0" y="293" font-size="14" font-weight="400" fill="#f0f6fc">TwelveMonkeys <tspan fill="#9198a1" font-weight="400">Java</tspan></text>
<rect x="230" y="280" width="116.5" height="18" rx="3" fill="#656c76"/>
